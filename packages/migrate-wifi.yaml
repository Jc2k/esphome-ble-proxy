# Save the currently deployed network into ESPHome's user-entered credential
# store. Public builds declare no station credentials, so ESPHome preserves it.
esphome:
  on_boot:
    - priority: -100
      then:
        - wifi.configure:
            ssid: !secret wifi_ssid
            password: !secret wifi_password
            save: true
            timeout: 30s
            on_connect:
              - logger.log: Wi-Fi credentials persisted for public firmware
            on_error:
              - logger.log:
                  level: ERROR
                  format: Failed to persist Wi-Fi credentials; do not install public firmware
