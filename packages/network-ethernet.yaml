ethernet:
  type: IP101
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  phy_addr: 1
  power_pin: GPIO5
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN

esphome:
  on_boot:
    - priority: 600
      then:
        - output.turn_on: power_led

status_led:
  pin:
    number: GPIO32
    inverted: true

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true
  on_ble_advertise:
    then:
      - output.turn_on: bluetooth_led
      - delay: 500ms
      - output.turn_off: bluetooth_led
