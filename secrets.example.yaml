# Copy to secrets.yaml for a single device migration. Never commit that file.
# This binding is checked by the guarded device staging command.
migration_device: "replace-with-the-device-name"
# Generate or copy the device's existing 32-byte ESPHome API key.
api_encryption_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
# This must match the OTA password currently installed on the target device.
legacy_ota_password: "replace-with-the-device-current-ota-password"
# Wi-Fi entries are ignored by the Ethernet migration.
wifi_ssid: "replace-with-the-current-wifi-ssid"
wifi_password: "replace-with-the-current-wifi-password"
